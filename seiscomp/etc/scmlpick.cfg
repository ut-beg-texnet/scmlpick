# Set the logging level between 1 and 4 where 1=ERROR, 2=WARNING, 3=INFO and
# 4=DEBUG.
logging.level = 4

# Enable rotation of log files.
logging.file.rotator = true

# The maximum number of historic log files to keep.
logging.file.rotator.archiveSize = 7

# The maximum size of a log file in byte. The default value is 100 megabyte. If
# a log file exceeds that size, then it is rotated. To disable the size limit
# give 0 or a negative value.
logging.file.rotator.maxFileSize = 104857600

# Define the URL of the messaging server to connect to. URL format is
# [scheme://]host[:port][/queue]. Default scheme: scmp, default port: 18180,
# default queue: production. Examples:
# All default: localhost
# Specific host: scmp://10.0.1.4:18180/production
# Specific host and SSL encryption: scmps://10.0.1.4:18180/production
connection.server = localhost/production
#connection.server = scdb.beg.utexas.edu/production

# Define the primary group of a module. This is the name of the group where a
# module sends its messages to if the target group is not explicitly given in
# the send call.
connection.primaryGroup = PICK

# Define a list of message groups to subscribe to. The default is usually given
# by the application and does not need to be changed.
connection.subscriptions = INVENTORY, CONFIG, LEQCCTET, LEQCCTDELN, LEQCCTDELC, LEQCCTDELS, LEQCCTMID, LEQCCTEF

# Define the list of channles types that are allowed to process. Example: HH, CH
whiteChanns = HH, CH, BH, EH

# Picker architecture. Stations are selected in the bindings, not here.
eqcct.architecture = eqcct

# EQCCT model to detect P phases.
eqcct.Pmodel = /opt/seiscomp/share/scmlpick/model/ModelPS/test_trainer_024.h5

# EQCCT model to detect S phases.
eqcct.Smodel = /opt/seiscomp/share/scmlpick/model/ModelPS/test_trainer_021.h5

# This host has no GPU. -1 selects CPU.
eqcct.gpuID = -1

# Define the time shift to initialize the filter. This data will not be
# processed, so timeShift must be greater than this. (in seconds)
eqcct.filterShift = 10

# Define the time in seconds to overlap with the previous window.
eqcct.timeShift = 20

# Minimum number of stations with windowLength data available to send to EQCCT
# after firstWait. This number should be less than the total stations. At least
# this number of real-time stations must be available to produce picks.
eqcct.minStasBulk = 5

# Minimum number of delayed stations with windowLength data available to send
# to EQCCT after firstWait. This number should be less than the total stations.
eqcct.minDelayStasBulk = 10

# Minimum delay between now and the end time of the last minute saved in memory
# to compute all data available. First computation.
eqcct.firstWait = 20

# Minimum time to wait after first computation to proceed with Second
# computation.
eqcct.secondWait = 10

# Maximum time to wait after first computation to proceed with second
# computation.
eqcct.maxWait = 10

# Define time in seconds to wait before sending the first data packet to eqcct.
eqcct.startLatency = 60

# Minimum delay in seconds between the current time and the start time of data
# acquired to send data to delayed data processing.
eqcct.traceDelay = 120

# Minimum probability to reach to send a new P pick.
eqcct.eqcctPthr = 0.07

# Minimum probability to reach to send a new S pick.
eqcct.eqcctSthr = 0.07

# Profile names must match the profiles in the bindings configuration.
pipelines.profiles = ET, DELN, DELC, DELS, MID, EF

####################### East Texas (ET) PROFILE ######################
# This is the name of the group to send pick messages for specific profile when
# standard pick delivery strategy is enabled
pipelines.profiles.ET.pickTargetGroup = PEQCCTET

# This is the name of the group to send location messages for specific profile
pipelines.profiles.ET.locTargetGroup = LEQCCTET

# This author should match the origin (location) author for locations to be
# checked against quality control parameters.
pipelines.profiles.ET.authorTarget = EQCCTscanET

# The BNA file defining regions (closed polygons) or tuple with 4 elements.
# Inside this region, the origin evaluation status is TrueOrgEvalStat, and
# outside is FalseOrgEvalStat. If this is set to none, then the origin location
# will not be checked against any polygon.
pipelines.profiles.ET.region = /opt/seiscomp/share/scmlpick/tools/regions/ET.bna

####################### Delaware North (DELN) PROFILE ######################
pipelines.profiles.DELN.pickTargetGroup = PEQCCTDELN

pipelines.profiles.DELN.locTargetGroup = LEQCCTDELN

pipelines.profiles.DELN.authorTarget = EQCCTscanDELN

pipelines.profiles.DELN.region = /opt/seiscomp/share/scmlpick/tools/regions/delN.bna

####################### Delaware Central (DELC) PROFILE ######################
pipelines.profiles.DELC.pickTargetGroup = PEQCCTDELC

pipelines.profiles.DELC.locTargetGroup = LEQCCTDELC

pipelines.profiles.DELC.authorTarget = EQCCTscanDELC

pipelines.profiles.DELC.region = /opt/seiscomp/share/scmlpick/tools/regions/delC.bna

####################### Delaware South (DELS) PROFILE ######################
pipelines.profiles.DELS.pickTargetGroup = PEQCCTDELS

pipelines.profiles.DELS.locTargetGroup = LEQCCTDELS

pipelines.profiles.DELS.authorTarget = EQCCTscanDELS

pipelines.profiles.DELS.region = /opt/seiscomp/share/scmlpick/tools/regions/delS.bna

####################### Midland (MID) PROFILE ######################
pipelines.profiles.MID.pickTargetGroup = PEQCCTMID

pipelines.profiles.MID.locTargetGroup = LEQCCTMID

pipelines.profiles.MID.authorTarget = EQCCTscanMID

pipelines.profiles.MID.region = /opt/seiscomp/share/scmlpick/tools/regions/mid_snyd_expan.bna

####################### Eagle Ford (EF) PROFILE ######################
pipelines.profiles.EF.pickTargetGroup = PEQCCTEF

pipelines.profiles.EF.locTargetGroup = LEQCCTEF

pipelines.profiles.EF.authorTarget = EQCCTscanEF

pipelines.profiles.EF.region = /opt/seiscomp/share/scmlpick/tools/regions/EagleFordPlay.bna

# Number of CPUs allocated for running the run_picker() to create the time
# chunks.
ray.numCPUs = 56

# Maximum number of tasks that are sent to the predictor at the same time.
ray.maxTasksQueue = 100

# Number of groups to split stations. Each group will work in parallel without
# affecting the others. This helps prevent delays when working with a large
# number of stations and is usually only required when running more than 100
# stations in real time.
ray.numWorkers = 4

# One loaded model per Ray process, bfloat16 math.
ray.execution = modelactor
ray.precision = bf16

# Set the origin evaluation status to use when the origin fulfills all quality
# thresholds. Use integers from 0 to 5. Each integer means following next list:
# 0=preliminary, 1=confirmed, 2=reviewed, 3=final, 4=rejected, 5=reported.
qcheck.TrueOrgEvalStat = 1

# Set the origin evaluation status to use when the origin does not fulfill one
# or more quality thresholds. Use integers from 0 to 5. Each integer means
# following next list: 0=preliminary, 1=confirmed, 2=reviewed, 3=final,
# 4=rejected, 5=reported
qcheck.FalseOrgEvalStat = 4
