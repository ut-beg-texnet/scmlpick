# Defines a list of message groups to subscribe to. The default is usually
# given by the application and does not need to be changed.
connection.subscriptions = INVENTORY,\
                           CONFIG, \
                           LOCATION

# Defines the primary group of a module. This is the name of the group where a
# module sends its messages to if the target group is not explicitely given in
# the send call.
connection.primaryGroup = PICK

# Defines the author name used to set creationInfo.author in data model objects.
author = @appname@@@@hostname@

# Define the list of channles types that are allowed to process. Example: HH, CH
whiteChanns = HH, CH, BH

# Picker architecture to use. All options return P/S probability curves on the
# same 60 s, 3-component windows.
#   eqcct        : plain EQCCT compact convolutional transformer (default).
#   utrans_eqcct : EQCCT picking heads fed by a pretrained U-Trans foundation
#                  encoder (self-supervised, latent features concatenated as a
#                  4th input channel). See https://doi.org/10.1038/s41598-026-41454-x
#                  Requires Pmodel/Smodel below to point to Foundation-EQCCT
#                  checkpoints trained with the U-Trans repository, not plain
#                  EQCCT weights.
#   phasenet     : official PhaseNet U-Net (Zhu & Beroza 2019), Keras port of
#                  the TensorFlow 1 graph. One checkpoint, not a P/S pair.
#                  Point Pmodel at the 190703-214543 directory. Smodel is ignored.
#                  PhaseNet normalizes each window itself. Its published pick
#                  threshold is 0.3, much higher than the EQCCT defaults below.
#   eqtransformer: official EQTransformer (Mousavi et al. 2020), the Keras 2.3
#                  file EqT_original_model.h5. One file, not a P/S pair.
#                  Point Pmodel at that file or its directory. Smodel is ignored.
#                  Needs the tf-keras package. Published mseed defaults are
#                  P/S threshold 0.1. The 1-45 Hz bandpass already matches the
#                  STEAD preprocessing described for this model.
eqcct.architecture = eqcct

# Model to detect P phases. Must match the architecture selected in eqcct.architecture:
# a plain EQCCT checkpoint for "eqcct", a fine-tuned Foundation-EQCCT checkpoint
# (U-Trans encoder + picking head, combined in one file) for "utrans_eqcct",
# or the official PhaseNet checkpoint directory for "phasenet",
# or EqT_original_model.h5 (or its directory) for "eqtransformer".
eqcct.Pmodel = @DATADIR@/scmlpick/model/ModelPS/test_trainer_024.h5

# Model to detect S phases. Same architecture-dependent requirement as Pmodel above.
# Ignored when eqcct.architecture is phasenet or eqtransformer.
eqcct.Smodel = @DATADIR@/scmlpick/model/ModelPS/test_trainer_021.h5

# Define the data window length to send to eqcct (in seconds)
eqcct.windowLength = 60

# Define the time shift to initialize the filter. This data will not be processed, so timeShift must be greater than this. (in seconds)
eqcct.filterShift = 2.5

# Define the time in seconds to overlap with the previous window.
eqcct.timeShift = 30

# Minimum number of stations with windowLength data available to send to EQCCT after firstWait. 
# This number should be less than the total stations.
# At least this number of real-time stations must be available to produce picks.
eqcct.minStasBulk = 5

# Minimum number of delayed stations with windowLength data available to send to EQCCT after firstWait. 
# This number should be less than the total stations.
eqcct.minDelayStasBulk = 5

# Minimum delay between now and the end time of the last minute saved in memory to compute all data available. First computation.
eqcct.firstWait = 8

# Minimum time to wait after first computation to proceed with Second computation.
eqcct.secondWait = 5

# Maximum time to wait after first computation to proceed with second computation.
eqcct.maxWait = 10

# Define time in seconds to wait before sending the first data packet to eqcct.
eqcct.startLatency = 60

# Maximum time in seconds to wait before remove traces from the processing stream.
eqcct.timeRemoveTrace = 600

# A station this many seconds behind the newest complete window is not sent
# as its own old window. Its samples stay in memory and it is picked on the
# live window once that window is covered. A shorter gap is still sent from
# the station's own start.
eqcct.traceDelay = 120

# Minimum probability to reach to send a new P pick.
eqcct.eqcctPthr = 0.001

# Minimum probability to reach to send a new S pick.
eqcct.eqcctSthr = 0.002

# Batch size. This wont affect the speed much but can affect the performance. A value beteen 200 to 1000 is recommended.
eqcct.eqcctBatchSize = 1

# GPU index passed to the picker. Set to -1 to run on CPU.
eqcct.gpuID = 0

# Set the maximum percentage of memory usage for the GPU.
eqcct.gpuLimit = 1

# List with profiles names.
pipelines.profiles = ''

# If enabled, the module sends picks to the messaging system as soon as the module produces them. In the default setup, 1-minute windows are processed every 30 seconds.
pipelines.Standard = true

# If enabled, the module sends picks simulating the true arrival time but includes a delay corresponding to the first processed window.
pipelines.Simulation = false

# If enabled, the module stores picks and sends them to the messaging system periodically, at a configurable time interval.
pipelines.Bulk = false

# Interval in seconds used when bulk pick delivery strategy is enabled
pipelines.bulkInterval = 1800

# This is the name of the group to send pick messages for specific profile when standard pick delivery strategy is enabled
pipelines.profiles.pickTargetGroup = "PICK"

# This is the name of the group to which pick messages will be sent for a specific profile when simulation pick delivery strategy is enabled
pipelines.profiles.pickSimulTargetGroup = "PICK"

# This is the name of the group to which pick messages will be sent for a specific profile when bulk pick delivery strategy is enabled
pipelines.profiles.pickBulkTargetGroup = "PICK"

# This is the name of the group to send location messages for specific profile
pipelines.profiles.locTargetGroup = "LOCATION"

# This author should match the origin (location) author for locations to be checked against quality control parameters.
pipelines.profiles.authorTarget = "EQCCT"

# The BNA file defining regions (closed polygons) or tuple with 4 elements. Inside this region, the origin evaluation status is TrueOrgEvalStat, and outside is FalseOrgEvalStat. If this is set to none, then the origin location will not be checked against any polygon.
pipelines.profiles.region = none

# Size of the Ray CPU pool. ray.init(num_cpus=this) is what limits how many
# Python processes run picker work at once. A process that has already been
# used stays alive and is reused. This is not ray.numWorkers.
ray.numCPUs = 5

# Number of given stations that are sent to the predictor at the same time.
ray.maxTasksQueue = 50

# Number of groups to split stations. Each group works on its own station list.
# This does not create ray.numCPUs processes. It only partitions the stations,
# which matters when more than about 100 stations run in real time.
ray.numWorkers = 1

# How a station reaches the neural network. Applies to eqcct, utrans_eqcct,
# phasenet and eqtransformer.
#   modelactor : RAPID Model-Actor. One process loads the picker and keeps it
#                for every station it receives. This is the default because it
#                was the faster orchestration in RAPID, and the model is not
#                rebuilt on every station.
#   task       : previous scmlpick behavior. Every station loads the picker
#                inside a Ray task. See ray.maxCalls for the RAM limit.
ray.execution = modelactor

# Compute precision for every picker above.
#   bf16 : bfloat16, the precision that won on time in RAPID and stayed close
#          to float32 picks. Weights stay the official float32 values; the
#          layer math runs in bfloat16. Default.
#   fp32 : previous full float32 math.
ray.precision = bf16

# Task mode only. After a worker finishes this many stations, that process
# exits and Ray starts another one on the same CPU. The station in progress
# is returned before the process exits, and a failed station is retried once.
# modelactor does not use this: those processes are the long-lived actors.
# At about 120 stations per hour and 1.7 GB/hour of growth, 300 stations is
# about 2.5 hours: the worker is near 5 GB, returns that pick, and exits.
ray.maxCalls = 300

# Set the latitude uncertainty threshold. Above this value, the origin evaluation status is FalseOrgEvalStat, and below is TrueOrgEvalStat.
qcheck.latUncTHR = 20

# Set the longitude uncertainty threshold. Above this value, the origin evaluation status is FalseOrgEvalStat, and below is TrueOrgEvalStat.
qcheck.lonUncTHR = 20

# Set the depth uncertainty threshold. Above this value, the origin evaluation status is FalseOrgEvalStat, and below is TrueOrgEvalStat.
qcheck.depthUncTHR = 20

# Set the depth threshold. Above this value, the origin evaluation status is FalseOrgEvalStat, and below is TrueOrgEvalStat.
qcheck.depthTHR = 20

# Set the azimuthal gap threshold. Above this value, the origin evaluation status is FalseOrgEvalStat, and below is TrueOrgEvalStat.
qcheck.azGapTHR = 270

# Set the origin evaluation status to use when the origin fulfills all quality thresholds. Use integers from 0 to 5. Each integer means following next list: 0=preliminary, 1=confirmed, 2=reviewed, 3=final, 4=rejected, 5=reported
qcheck.TrueOrgEvalStat = 5

# Set the origin evaluation status to use when the origin does not fulfill one or more quality thresholds. Use integers from 0 to 5. Each integer means following next list: 0=preliminary, 1=confirmed, 2=reviewed, 3=final, 4=rejected, 5=reported
qcheck.FalseOrgEvalStat = 4
